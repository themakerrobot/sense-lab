name: CI

# 손으로 맞춰야 하는 것이 어긋났는지 본다.
# 지금은 하나뿐이다: css/maker-ui.css 는 공용 디자인 킷
# (themakerrobot/themaker-ui)의 복사본이라, 원본이 바뀌었는데 안 가져오거나
# 이쪽에서 몰래 고치면 자매 서비스와 화면이 어긋난다.

on:
  push:
    branches: ['**']
  pull_request:

jobs:

  syntax:
    name: 문법
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 브라우저 JS
        run: for f in lib/*.js; do [ "$(basename "$f")" = jszip.min.js ] || node --check "$f"; done

